server {
    listen 80;
    server_name localhost;
    root /var/www/html;
    index index.php index.html index.htm;

    # API routes
    location /v1/ {
        try_files $uri $uri/ /sections/api/index.php?$query_string;
    }

    # Angular frontend
    location /angularIndex/ {
        try_files $uri $uri/ /angularIndex/index.html;
    }

    # Game world routes
    location ~ ^/(testworld|demo)/ {
        try_files $uri $uri/ @game_world;
    }

    location @game_world {
        rewrite ^/(testworld|demo)/(.*)$ /sections/servers/$1/public/$2 last;
    }

    # PHP processing
    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

    # Error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        root /var/www/html;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }

    # Deny access to backup and source files
    location ~* \.(bak|backup|sql|tar|gz|zip)$ {
        deny all;
    }
}
