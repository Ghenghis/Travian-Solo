# Redis configuration for Travian
bind 0.0.0.0
port 6379
timeout 0
tcp-keepalive 300
loglevel notice
logfile /data/redis-server.log
databases 16

# Snapshotting
save 900 1
save 300 10
save 60 10000

# Security
protected-mode yes

# Limits
maxclients 10000
maxmemory 256mb
maxmemory-policy allkeys-lru

# Append only mode
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# Slow log
slowlog-log-slower-than 10000
slowlog-max-len 128
